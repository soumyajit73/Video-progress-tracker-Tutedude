<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Video Progress Tracker</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #1097f7;
        }
        #video-container {
            margin-bottom: 20px;
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            width: 90%;
            max-width: 800px; /* Max width for larger screens */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #lecture-video {
            width: 100%; /* Make video responsive */
            max-width: 800px; /* Max width for larger screens */
            display: block; /* Remove extra space below video */
            border-radius: 4px;
        }
        #progress-area {
            width: 100%;
            max-width: 800px;
            margin-top: 10px;
            text-align: center;
            position: relative; /* Make this the positioning context for absolute children */
            padding-bottom: 10px; /* Keep space below the bar */
            /* Removed padding-top here */
        }
        #progress-bar-container {
            width: 100%;
            height: 20px;
            background-color: #ddd; /* Background for unwatched/skipped parts */
            border-radius: 10px;
            overflow: hidden; /* Keep segments inside rounded corners */
            position: relative; /* Needed for absolute positioning of segments */
            cursor: pointer; /* Indicate that this area is interactive */
            /* Removed negative margin-top here */
             margin-top: 5px; /* Add a small margin below the percentage text */
        }
        .watched-segment {
            position: absolute;
            top: 0;
            height: 100%;
            background-color: #fa4242; /* Green color for watched parts */
            /* Left position and width will be set by JavaScript */
        }

        /* --- Styles for the single hover timestamp label --- */
        #hover-timestamp-label {
            position: absolute;
            /* Position will be set dynamically by JavaScript relative to #progress-area */
            top: 5px; /* Position slightly above the percentage text */
            font-size: 0.75em;
            color: #333; /* Darker color for text */
            white-space: nowrap;
            background-color: #fff;
            padding: 5px 8px; /* More padding */
            border-radius: 4px; /* Slightly more rounded */
            border: 1px solid #bbb; /* Slightly darker border */
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); /* More prominent shadow */
            z-index: 10; /* Ensure it's on top */
            pointer-events: none; /* Allow interaction with elements underneath */
            /* --- Hide by default --- */
            display: none;
            transform: translateX(-50%); /* Center the label horizontally relative to its left point */
        }


    </style>
</head>
<body>

    <h1>Lecture Video</h1>

    <div id="video-container">
        <video id="lecture-video" controls>
            <source src="WhatsApp Video 2025-04-30 at 9.35.05 PM.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <div id="progress-area">
      <strong>Unique Progress</strong>  : <strong><span id="progress-percentage">0.0</span>%</strong>
        <div id="hover-timestamp-label"></div>
        <div id="progress-bar-container">
             </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
